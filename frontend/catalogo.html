<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tienda Express - Catálogo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand" href="/">Tienda Express</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Inicio</a>
        <a class="nav-link active" href="/catalogo">Catálogo</a>
        <a class="nav-link" href="/carrito">Carrito</a>
        <a class="nav-link" href="/login">Registro/Login</a>
        <a class="nav-link" href="/contacto">Contacto</a>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2>Catálogo de productos</h2>
    <div id="productos" class="row mt-4"></div>
  </div>

  <script src="script.js"></script>
  <script>
    fetch('/api/productos')
      .then(res => res.json())
      .then(productos => {
        const cont = document.getElementById('productos');
        productos.forEach(p => {
          cont.innerHTML += `
            <div class="col-md-4 mb-3">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">${p.nombre}</h5>
                  <p class="card-text">S/ ${p.precio}</p>
                  <button class="btn btn-outline-success">Agregar al carrito</button>
                </div>
              </div>
            </div>`;
        });
      });
  </script>
</body>
</html>
